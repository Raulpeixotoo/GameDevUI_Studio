    <!-- LEFT SIDEBAR -->
    <aside id="leftPanel" class="w-64 bg-figma-panel border-r border-figma-border flex flex-col shrink-0 z-20">
      <div class="p-3 border-b border-figma-border bg-zinc-900/40">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-figma-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span class="text-xs font-semibold uppercase tracking-wider text-zinc-300" data-i18n>Rascunho / Blockout</span>
          </div>
          <button id="btnClearRef" class="text-[10px] text-zinc-500 hover:text-red-400 hidden" data-i18n>Remover</button>
        </div>

        <div class="flex flex-col gap-2">
          <div id="refDropZone" class="relative group cursor-pointer flex flex-col items-center justify-center gap-1.5 border-2 border-dashed border-zinc-700 hover:border-figma-accent rounded-lg p-3 bg-zinc-900/80 hover:bg-zinc-800/80 transition-all text-center">
            <input type="file" id="inputRefImage" accept="image/png,image/jpeg,image/webp,image/svg+xml" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10">
            <svg class="w-5 h-5 text-zinc-400 group-hover:text-figma-accent group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span id="refUploadLabel" class="text-[11px] text-zinc-300 font-medium leading-tight">Clique ou arraste seu Mockup 1080p</span>
            <span class="text-[9px] text-zinc-500" data-i18n>PNG, JPG ou WebP</span>
          </div>

          <div id="refControls" class="flex flex-col gap-2 mt-1 hidden">
            <div class="flex items-center justify-between text-[11px] text-zinc-400">
              <span><span data-i18n>Opacidade:</span> <span id="refOpacityVal" class="text-zinc-200 font-mono">50%</span></span>
              <div class="flex items-center gap-1">
                <button id="btnToggleRefVisible" class="p-1 rounded hover:bg-zinc-800 text-figma-accent">
                  <svg id="iconRefVisible" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
                <button id="btnToggleRefFit" class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-mono">Esticar</button>
              </div>
            </div>
            <input type="range" id="refOpacityRange" min="5" max="100" value="50" class="w-full h-1 bg-zinc-700 rounded-lg appearance-none cursor-pointer">
            <label class="flex items-center gap-1.5 text-[10px] text-zinc-400 cursor-pointer">
              <input type="checkbox" id="chkIncludeRefSceneExport" class="rounded text-figma-accent">
              <span data-i18n>Incluir rascunho ao exportar cena</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Camadas (R8): título numa linha e as 8 ações numa barra própria, distribuídas na largura
           (cabem no painel na largura mínima de 200 px) -->
      <div class="px-2.5 pt-2.5 pb-2 border-b border-figma-border space-y-2">
        <span class="block text-xs font-semibold uppercase tracking-wider text-zinc-300 truncate" data-i18n>Camadas da Cena</span>
        <div id="layerToolbar" class="flex items-center justify-between bg-zinc-950/60 border border-figma-border rounded-md px-1 py-0.5">
          <button id="btnLayerUp" class="layer-tool" title="Trazer para frente (Ctrl+])" data-i18n-title>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
          </button>
          <button id="btnLayerDown" class="layer-tool" title="Enviar para trás (Ctrl+[)" data-i18n-title>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <button id="btnGroupLayers" class="layer-tool hover:!text-amber-400" title="Agrupar selecionados (Ctrl+G)" data-i18n-title>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2zM12 11v5M9.5 13.5h5"/></svg>
          </button>
          <button id="btnUngroupLayers" class="layer-tool hover:!text-amber-400" title="Desagrupar (Ctrl+Shift+G)" data-i18n-title>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2zM9.5 13.5h5"/></svg>
          </button>
          <button id="btnLockLayers" class="layer-tool" title="Bloquear / desbloquear seleção (Ctrl+Shift+L): o clique no canvas atravessa itens bloqueados" data-i18n-title>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M8 11V7a4 4 0 018 0v4"/></svg>
          </button>
          <button id="btnMergeLayers" class="layer-tool hover:!text-cyan-400" title="Mesclar em uma imagem (Ctrl+E)" data-i18n-title>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6l8 4 8-4-8-4-8 4zM4 12l8 4 8-4M4 18l8 4 8-4"/></svg>
          </button>
          <button id="btnDuplicateLayer" class="layer-tool" title="Duplicar (Ctrl+D)" data-i18n-title>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/></svg>
          </button>
          <button id="btnDeleteLayer" class="layer-tool hover:!text-red-400" title="Excluir (Del)" data-i18n-title>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>

      <div class="px-2 pt-2 pb-1">
        <div class="flex items-center gap-1.5 bg-zinc-900 border border-figma-border rounded px-2 py-1 focus-within:border-figma-accent">
          <svg class="w-3 h-3 text-zinc-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M20 20l-3.5-3.5"/></svg>
          <input type="text" id="layerSearch" placeholder="Buscar camada..." data-i18n-ph class="bg-transparent w-full text-[11px] text-zinc-200 focus:outline-none">
        </div>
      </div>

      <!-- min-h-0 é o que permite o scroll: sem ele o flex item cresce com o conteúdo e a lista nunca rola -->
      <div id="layersList" class="flex-1 min-h-0 overflow-y-auto p-1.5 flex flex-col gap-0.5"></div>

      <div class="p-2 border-t border-figma-border text-[11px] text-zinc-400 flex items-center justify-between bg-zinc-900/60">
        <span id="layerCountText">0 componentes</span>
        <button id="btnClearAll" class="text-zinc-500 hover:text-red-400" data-i18n>Limpar Tudo</button>
      </div>
    </aside>
