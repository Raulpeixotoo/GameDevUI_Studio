  <!-- Barra superior (R7). Esquerda: arquivo, histórico e inserir. Centro: configurações da cena. Direita: visualização e export.
       Rótulos só aparecem em telas largas; abaixo disso ficam os ícones (com tooltip). overflow-x é a última rede de segurança. -->
  <header id="topBar" class="h-11 bg-figma-panel border-b border-figma-border items-center px-3 z-40 shrink-0 gap-3 overflow-x-auto">
    <!-- Esquerda -->
    <div class="flex items-center gap-2 justify-self-start">
      <div class="flex items-center gap-2 mr-0.5">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-figma-accent to-blue-600 flex items-center justify-center text-white font-mono font-bold text-xs shadow-md shadow-blue-500/20">
          UI
        </div>
        <div class="hidden min-[1700px]:flex flex-col">
          <span class="font-bold text-xs tracking-wider uppercase text-zinc-100 leading-none">Game UI</span>
          <span class="text-[9px] text-zinc-400 font-mono leading-tight">Studio</span>
        </div>
      </div>

      <div class="tb-group">
        <button id="btnSaveProject" class="tb-btn" title="Salvar todo o layout em arquivo (.json)" data-i18n-title>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
          <span class="hidden min-[1500px]:inline" data-i18n>Salvar</span>
        </button>
        <label class="tb-btn cursor-pointer" title="Carregar layout salvo (.json)" data-i18n-title>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          <span class="hidden min-[1500px]:inline" data-i18n>Abrir</span>
          <input type="file" id="inputLoadProject" accept=".json,application/json" class="hidden">
        </label>
        <label class="tb-btn cursor-pointer" title="Importar layout para a cena (soma os itens de outro .json aos atuais; também dá para arrastar o .json no canvas)" data-i18n-title>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          <input type="file" id="inputImportLayout" accept=".json,application/json" class="hidden">
        </label>
        <div class="tb-sep"></div>
        <button id="btnUndo" disabled class="tb-btn" title="Desfazer (Ctrl+Z)" data-i18n-title>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a5 5 0 015 5v2M3 10l5-5M3 10l5 5"/></svg>
        </button>
        <button id="btnRedo" disabled class="tb-btn" title="Refazer (Ctrl+Shift+Z / Ctrl+Y)" data-i18n-title>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10H11a5 5 0 00-5 5v2m15-7l-5-5m5 5l-5 5"/></svg>
        </button>
      </div>

      <!-- Inserir: só ícones (cor = tipo do item, a mesma da lista de camadas) -->
      <div class="tb-group">
        <button id="btnAddSlot" class="tb-btn" title="Slot de inventário" data-i18n-title>
          <svg class="text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/></svg>
        </button>
        <button id="btnAddButton" class="tb-btn" title="Botão" data-i18n-title>
          <svg class="text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3" stroke-width="2"/></svg>
        </button>
        <button id="btnAddBar" class="tb-btn" title="Barra (vida, mana, XP)" data-i18n-title>
          <svg class="text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/></svg>
        </button>
        <button id="btnAddPanel" class="tb-btn" title="Painel / janela" data-i18n-title>
          <svg class="text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" stroke-width="2" stroke-dasharray="4 2"/></svg>
        </button>
        <button id="btnAddText" class="tb-btn" title="Caixa de texto (T)" data-i18n-title>
          <svg class="text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 6h14M12 6v13M9 19h6"/></svg>
        </button>
        <button id="btnAddRing" class="tb-btn" title="Medidor circular (vida, cooldown, atributo)" data-i18n-title>
          <svg class="text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2.5" d="M12 3a9 9 0 11-8.5 6"/></svg>
        </button>
        <button id="btnAddShape" class="tb-btn" title="Forma: estrela, polígono, elipse, seta" data-i18n-title>
          <svg class="text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linejoin="round" stroke-width="2" d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/></svg>
        </button>
      </div>
    </div>

    <!-- Centro: configurações da cena -->
    <div class="tb-group justify-self-center" title="Configurações da cena" data-i18n-title>
      <span class="tb-label">Res</span>
      <!-- Opções montadas por JS a partir de RESOLUTION_PRESETS (grupos Desktop / Celular / Tablet) -->
      <select id="canvasResSelect" class="tb-select" title="Resolução da cena" data-i18n-title>
        <option value="1920x1080" selected>1920×1080</option>
      </select>
      <button id="btnRotateRes" class="tb-btn" title="Girar a cena (retrato ⇄ paisagem)" data-i18n-title>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 9a8 8 0 00-3-5m0 0v3m0-3h-3"/></svg>
      </button>
      <button id="btnToggleSafeArea" class="tb-btn" title="Área segura do aparelho (notch, barras do sistema)" data-i18n-title>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M10 5h4"/><rect x="8.5" y="8" width="7" height="8" rx="1" stroke-width="1.5" stroke-dasharray="2 1.5"/></svg>
      </button>
      <div class="tb-sep"></div>
      <label class="tb-btn cursor-pointer select-none" title="Encaixar no grid ao mover e redimensionar" data-i18n-title>
        <input type="checkbox" id="chkSnapGrid" class="rounded border-zinc-700 bg-zinc-900 text-figma-accent focus:ring-0 w-3.5 h-3.5">
        <span class="hidden min-[1400px]:inline text-[11px] font-mono">Snap</span>
      </label>
      <select id="gridSizeSelect" class="tb-select" title="Tamanho do grid" data-i18n-title>
        <option value="4">4px</option>
        <option value="8">8px</option>
        <option value="16" selected>16px</option>
        <option value="32">32px</option>
        <option value="64">64px</option>
      </select>
      <button id="btnToggleGrid" class="tb-btn" title="Mostrar grid na cena" data-i18n-title>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 4h16v16H4zM4 10h16M4 15h16M10 4v16M15 4v16"/></svg>
      </button>
      <button id="btnToggleRulers" class="tb-btn text-figma-accent" title="Réguas e guias (Shift+R)" data-i18n-title>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M3 3h18v6H3zM3 3v18h6V3M7 3v3M11 3v3M15 3v3M3 7h3M3 11h3M3 15h3"/></svg>
      </button>
    </div>

    <!-- Direita: zoom, scripts, export, idioma -->
    <div class="flex items-center gap-2 justify-self-end">
      <div class="tb-group font-mono">
        <button id="btnZoomOut" class="tb-btn" title="Diminuir zoom (Ctrl −)" data-i18n-title>−</button>
        <span id="zoomLabel" class="w-11 text-center text-[11px] text-zinc-300 font-semibold select-none">100%</span>
        <button id="btnZoomIn" class="tb-btn" title="Aumentar zoom (Ctrl +)" data-i18n-title>+</button>
        <div class="tb-sep"></div>
        <button id="btnZoomFit" class="tb-btn text-[11px]" title="Enquadrar a cena (Shift+1)" data-i18n-title>Fit</button>
        <button id="btnZoomReset" class="tb-btn text-[11px]" title="Zoom 100% (Shift+0)" data-i18n-title>1:1</button>
      </div>

      <div class="tb-group">
        <button id="btnOpenScriptModal" class="tb-btn" title="Scripts / Workbench (Ctrl+J)" data-i18n-title>
          <svg class="text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
          <span class="hidden min-[1600px]:inline">Scripts</span>
        </button>
      </div>

      <button id="btnExportMenu" class="h-8 bg-figma-accent hover:bg-figma-accentHover text-white text-xs font-semibold pl-3 pr-2 rounded-lg flex items-center gap-1.5 transition shadow whitespace-nowrap shrink-0" title="Exportar (formato, resolução e destino)" data-i18n-title aria-haspopup="menu" aria-expanded="false">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        <span data-i18n>Exportar</span>
        <svg class="w-3 h-3 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 9l6 6 6-6"/></svg>
      </button>

      <select id="langSelect" class="tb-select border border-figma-border h-8" title="Idioma / Language">
        <option value="pt">PT</option>
        <option value="en">EN</option>
      </select>
    </div>
  </header>

  <!-- Menu de export: fora do header (o overflow-x dele cortaria o popover); posicionado por JS abaixo do botão -->
  <div id="exportMenu" role="menu" class="hidden fixed z-50 w-80 bg-figma-panel border border-figma-borderLight rounded-lg shadow-2xl shadow-black/60 p-1.5">
    <div class="grid grid-cols-[5.5rem_1fr] gap-2 px-2 pt-1.5 pb-2.5 border-b border-figma-border mb-1">
      <label class="flex flex-col gap-1">
        <span class="tb-label !pl-0" data-i18n>Formato</span>
        <select id="exportFormatSelect" class="tb-select border border-figma-border bg-zinc-900" title="Formato de Item e Cena (SVG = vetor, para sites)" data-i18n-title>
          <option value="png">PNG</option>
          <option value="svg">SVG</option>
        </select>
      </label>
      <label class="flex flex-col gap-1">
        <span class="tb-label !pl-0" data-i18n>Resolução</span>
        <select id="exportScaleSelect" class="tb-select border border-figma-border bg-zinc-900" title="Resolução do export (PNGs, manifest e cena Godot)" data-i18n-title></select>
      </label>
    </div>
    <button id="btnExportSelected" role="menuitem" class="menu-item" title="Exportar item selecionado (PNG)" data-i18n-title>
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" stroke-width="2"/></svg>
      <span><span data-i18n>Item selecionado</span><small data-i18n>Só a seleção, no formato escolhido</small></span>
    </button>
    <button id="btnExportScene" role="menuitem" class="menu-item" title="Exportar a cena inteira (PNG)" data-i18n-title>
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span><span data-i18n>Cena inteira</span><small data-i18n>Uma imagem com tudo que está no canvas</small></span>
    </button>
    <button id="btnExportBatch" role="menuitem" class="menu-item" title="Exportar tudo em ZIP com manifest para Unity, Unreal e Godot" data-i18n-title>
      <svg class="!text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
      <span><span data-i18n>Pacote ZIP para engines</span><small data-i18n>PNGs 9-slice + manifest Unity, Unreal e Godot</small></span>
    </button>
    <button id="btnExportScript" role="menuitem" class="menu-item" title="Gerar o código Studio que recria a seleção" data-i18n-title>
      <svg class="!text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
      <span><span data-i18n>Script da seleção (JS)</span><small data-i18n>Código Studio para recriar ou compartilhar</small></span>
    </button>
  </div>
